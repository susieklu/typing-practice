<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <!-- Add Google Fonts stylesheet for Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <h1 id="level-indicator">Level 1: Home Row Practice</h1>
    <p>Practice: Type the home row keys, focusing on keeping your fingers in the correct positions.</p>
    <p>Focus: Don't look at the keyboard, and maintain focus on accuracy.</p>
    <div id="text-display"></div>
    <div id="feedback"></div>
    <button id="next-sentence-button" style="display: none;">Next Sentence</button>
    <div id="level-buttons">
        <button id="jump-to-level-1">Jump to Level 1</button> <!-- New button for Level 1 -->
        <button id="jump-to-level-2">Jump to Level 2</button>
        <button id="jump-to-level-3">Jump to Level 3</button>
        <button id="jump-to-level-4">Jump to Level 4</button>
        <button id="jump-to-level-5">Jump to Level 5</button>
        <button id="jump-to-level-6">Jump to Level 6</button>
        <button id="jump-to-level-7">Jump to Level 7</button>
    </div>
    <!-- Add the logo below the buttons -->
    <div id="logo-container" style="text-align: center; margin-top: 20px;">
        <img src="./images/Operation Spark Logo.png" alt="Operation Spark Logo" style="max-width: 100px;">
    </div>
    <script src="./scripts/app.js"></script>
</body>
</html>
